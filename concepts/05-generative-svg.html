<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>05 · Cast a Shield — Bull Arcade</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  html, body { margin: 0; height: 100dvh; background: #0a0605; overflow: hidden; font-family: var(--mono); color: var(--limestone); -webkit-user-select: none; user-select: none; }
  .screen { position: fixed; inset: 0; background: url('./first-look/05-cast-a-shield.png') center/contain no-repeat, #0a0605; transition: filter 0.35s ease-out, transform 0.35s ease-out; }
  .screen.quake { animation: quake 0.4s ease-out; }
  @keyframes quake { 0%,100% { transform: scale(1); } 30% { transform: scale(1.02) rotate(0.6deg); } 60% { transform: scale(1.015) rotate(-0.4deg); } }
  .brass-btns { position: fixed; left: 50%; top: 64%; transform: translateX(-50%); display: flex; gap: 3.2vw; z-index: 6; }
  .brass { width: 13vw; height: 6.2vh; max-width: 180px; max-height: 60px; cursor: pointer; background: transparent; border: 0; outline: 0; }
  .brass:active { filter: brightness(1.3); }
  .controls { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
  .btn { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soot); background: var(--gold); border: 1px solid var(--gold-hover); padding: 10px 16px; border-radius: 3px; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .readout { position: fixed; top: 12px; right: 14px; z-index: 10; font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; background: rgba(10,6,5,0.82); padding: 6px 10px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; }
  .readout b { color: var(--limestone); }
  .back { position: fixed; top: 12px; left: 14px; z-index: 10; color: var(--gold); text-decoration: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; background: rgba(10,6,5,0.82); padding: 7px 12px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; }
  .back:hover { background: var(--red); color: var(--limestone); }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<a class="back" href="./index.html">← Arcade</a>
<div class="readout">SHIELDS CAST <b id="c">1</b> · RAINBOW <b id="rb">0</b>%</div>
<div class="brass-btns">
  <button class="brass" data-k="horns" aria-label="Re-roll Horns"></button>
  <button class="brass" data-k="hide" aria-label="Re-roll Hide"></button>
  <button class="brass" data-k="marks" aria-label="Re-roll Marks"></button>
</div>
<div class="controls">
  <button class="btn" data-k="horns">Re-roll Horns</button>
  <button class="btn" data-k="hide">Re-roll Hide</button>
  <button class="btn" data-k="marks">Re-roll Marks</button>
</div>
<script>
const screen = document.getElementById('screen');
let c = 1, rolls = 0;
function roll() {
  c++; rolls++;
  document.getElementById('c').textContent = c;
  const rainbowFactor = Math.min(1, rolls / 12);
  const hue = rolls * 30;
  const sat = 1 + rainbowFactor * 0.8;
  document.getElementById('rb').textContent = Math.round(rainbowFactor * 100);
  screen.style.filter = `hue-rotate(${hue}deg) saturate(${sat})`;
  screen.classList.remove('quake'); void screen.offsetWidth; screen.classList.add('quake');
}
document.querySelectorAll('.btn, .brass').forEach(b => b.addEventListener('click', roll));
</script>
</body>
</html>
