<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>07 · Match the Roar — Bull Arcade</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  html, body { margin: 0; height: 100dvh; background: #0a0605; overflow: hidden; font-family: var(--mono); color: var(--limestone); -webkit-user-select: none; user-select: none; }
  .screen { position: fixed; inset: 0; background: url('./first-look/07-match-the-roar.png') center/contain no-repeat, #0a0605; transition: filter 0.12s, transform 0.12s; }
  .screen.active { filter: brightness(1.08) saturate(1.12); }
  .hit-zone { position: fixed; inset: 0; z-index: 5; touch-action: manipulation; }
  .readout { position: fixed; top: 12px; right: 14px; z-index: 10; font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; background: rgba(10,6,5,0.72); padding: 6px 10px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; text-align: right; line-height: 1.6; }
  .readout b { color: var(--limestone); }
  .readout .big { font-size: 22px; color: var(--red); }
  .cta { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soot); background: var(--gold); border: 1px solid var(--gold-hover); padding: 12px 22px; border-radius: 3px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .back { position: fixed; top: 12px; left: 14px; z-index: 10; color: var(--gold); text-decoration: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; background: rgba(10,6,5,0.72); padding: 7px 12px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; }
  .back:hover { background: var(--red); color: var(--limestone); }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<a class="back" href="./index.html">← Arcade</a>
<div class="readout">
  POWER <span class="big" id="pwr">0</span>%<br>
  HOLD <b id="hold">5.0</b>s
</div>
<button class="cta" id="start">Hold the Roar</button>
<script>
let stream, audioCtx, analyser, data, holding = false, power = 0, held = 0, last = 0;
const screen = document.getElementById('screen');
const btn = document.getElementById('start');
btn.addEventListener('click', async () => {
  try {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      data = new Uint8Array(analyser.frequencyBinCount);
    }
    holding = true; held = 0; last = performance.now(); btn.textContent = 'ROARING…';
  } catch (e) { btn.textContent = 'Mic blocked — tap to retry'; }
});
function loop() {
  if (holding && analyser) {
    analyser.getByteFrequencyData(data);
    let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i];
    power = Math.min(100, Math.round(sum / data.length * 0.9));
    const now = performance.now();
    if (power > 55) { held += (now - last) / 1000; screen.classList.add('active'); }
    else screen.classList.remove('active');
    last = now;
    document.getElementById('pwr').textContent = power;
    document.getElementById('hold').textContent = Math.max(0, 5 - held).toFixed(1);
    if (held >= 5) { holding = false; btn.textContent = 'ROAR COMPLETE — tap again'; screen.classList.remove('active'); }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
