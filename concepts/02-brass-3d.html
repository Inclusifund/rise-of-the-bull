<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>02 · Brass Idol — Bull Arcade</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  html, body { margin: 0; height: 100dvh; background: #0a0605; overflow: hidden; font-family: var(--mono); color: var(--limestone); -webkit-user-select: none; user-select: none; }
  .stage { position: fixed; inset: 0; perspective: 1400px; transform-style: preserve-3d; }
  .screen { position: absolute; inset: 0; background: url('./first-look/02-brass-idol.png') center/contain no-repeat, #0a0605; transform-origin: center; will-change: transform, filter; }
  .hit-zone { position: fixed; inset: 0; z-index: 5; cursor: grab; touch-action: none; }
  .hit-zone:active { cursor: grabbing; }
  .back { position: fixed; top: 12px; left: 14px; z-index: 10; color: var(--gold); text-decoration: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; background: rgba(10,6,5,0.82); padding: 7px 12px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; }
  .back:hover { background: var(--red); color: var(--limestone); }
  .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; z-index: 10; background: rgba(10,6,5,0.82); padding: 6px 14px; border: 1px solid rgba(212,168,67,0.4); border-radius: 3px; }
</style>
</head>
<body>
<div class="stage">
  <div class="screen" id="screen"></div>
</div>
<div class="hit-zone" id="hz"></div>
<a class="back" href="./index.html">← Arcade</a>
<div class="hint">Drag to Spin · Wheel to Zoom</div>
<script>
const screen = document.getElementById('screen');
const hz = document.getElementById('hz');
let ry = 0, rx = 0, scale = 1, dragging = false, lx = 0, ly = 0, idle = 0, lastInteract = performance.now();
function render() {
  const now = performance.now();
  const idleTime = now - lastInteract;
  if (!dragging && idleTime > 1200) {
    idle += 0.014;
    ry += (Math.sin(idle) * 22.5 - (ry % 360)) * 0.02 + 0.25;
    rx += (Math.cos(idle * 0.7) * 4 - rx) * 0.04;
  }
  const normY = ((ry % 360) + 540) % 360 - 180;
  const lum = 1 + Math.abs(normY) / 180 * 0.12;
  screen.style.transform = `scale(${scale}) rotateY(${ry}deg) rotateX(${rx}deg)`;
  screen.style.filter = `brightness(${lum})`;
  requestAnimationFrame(render);
}
hz.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; hz.setPointerCapture(e.pointerId); lastInteract = performance.now(); });
hz.addEventListener('pointermove', e => {
  if (!dragging) return;
  ry += (e.clientX - lx) * 0.55;
  rx -= (e.clientY - ly) * 0.35;
  rx = Math.max(-45, Math.min(45, rx));
  lx = e.clientX; ly = e.clientY; lastInteract = performance.now();
});
hz.addEventListener('pointerup', () => { dragging = false; lastInteract = performance.now(); });
hz.addEventListener('wheel', e => { e.preventDefault(); scale = Math.max(0.6, Math.min(1.8, scale - e.deltaY * 0.002)); lastInteract = performance.now(); }, { passive: false });
render();
</script>
</body>
</html>
